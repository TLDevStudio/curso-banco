<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro · Onda de Resultados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <div class="auth-box">
        <div class="auth-logo">Onda de <span>Resultados</span></div>
        <p class="auth-subtitle">Crie sua conta para começar</p>

        <div class="auth-erro" id="erroMsg"></div>
        <div class="auth-sucesso" id="sucessoMsg"></div>
        <form id="formCadastro">
            <div class="auth-field">
                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" />
            </div>

            <div class="auth-field">
                <label>Email</label>
                <input type="email" id="email" placeholder="seu@email.com" />
            </div>

            <div class="auth-field">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres" />
            </div>

            <button class="auth-btn" id="btnCadastro">
                Criar Conta
            </button>
        </form>

        <div class="auth-link">
            Já tem conta? <a href="login.html">Entrar</a>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/cadastro.js"></script>
</body>

</html>
